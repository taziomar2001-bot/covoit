<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="CoVoit — organise your university commute in seconds.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<title>CoVoit</title>
</head>
<body>
<style>
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:#0b0c12;z-index:5}
  @media(prefers-color-scheme:light){#boot{background:#fafafb}}
  #boot .m{width:52px;height:52px;border-radius:15px;background:linear-gradient(150deg,#4f46e5,#6366f1);
    display:grid;place-items:center;color:#fff;font:800 22px/1 -apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:-1px;
    animation:bp 1.1s ease-in-out infinite}
  @keyframes bp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.9);opacity:.72}}
</style>
<div class="app" id="app">
  <div class="topbar" id="topbar" hidden></div>
  <div class="screen" id="screen"></div>
  <nav class="nav" id="nav" hidden></nav>
</div>
<div id="boot"><div class="m">Co</div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="modal-scrim" id="modalScrim"></div>
<div class="modal" id="modal"></div>
<input type="file" id="filepick" accept="image/*" hidden>
<script type="module" src="/src/main.js"></script>
</body>
</html>
