<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="CoVoit — organise your university commute in seconds.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<title>CoVoit</title>
</head>
<body>
<style>
  #boot{position:fixed;inset:0;display:grid;place-items:center;background:#0b0c12;z-index:5}
  @media(prefers-color-scheme:light){#boot{background:#fafafb}}
  #boot img{width:92px;height:92px;border-radius:22px;animation:bp 1.2s ease-in-out infinite;box-shadow:0 12px 34px rgba(0,0,0,.28)}
  @keyframes bp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.93);opacity:.78}}
</style>
<div class="app" id="app">
  <div class="topbar" id="topbar" hidden></div>
  <div class="screen" id="screen"></div>
  <nav class="nav" id="nav" hidden></nav>
</div>
<div id="boot"><img src="/icon-192.png" alt="CoVoit"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="modal-scrim" id="modalScrim"></div>
<div class="modal" id="modal"></div>
<input type="file" id="filepick" accept="image/*" hidden>
<script type="module" src="/src/main.js"></script>
</body>
</html>
